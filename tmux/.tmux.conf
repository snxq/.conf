# use zsh as default shell
set -g default-shell /usr/bin/zsh

# enable mouse, focus tracking, and keep Emacs-style copy-mode keys
set-option -g mouse on
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
setw -g mode-keys emacs

# restore tmux 3.7 default: Ctrl+left-click a pane swaps it with the marked pane
bind -n C-MouseDown1Pane { swap-pane -s@ }

# replace C-b with C-t
set -g prefix C-t
unbind C-b
unbind C-a
bind C-t send-prefix

# reload the symlinked user config directly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# 1s redraw for second-level data (scrolling lyrics)
set -g status-interval 1

# disable activity monitoring to avoid noisy window markers
setw -g monitor-activity off

# keep tmux defaults for copy-mode and paste-buffer
# add a convenient extra shortcut and familiar pane navigation
bind Space copy-mode
unbind-key b
unbind-key f
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# open new windows and panes in the current pane path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# agent-deck configuration
# agent-deck-tmux-config-version: 2
# Added by agent-deck installer - 2026-03-04
# https://github.com/asheshgoplani/agent-deck

# Terminal with true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set -ag terminal-overrides ",*256col*:Tc"

# Performance
set -sg escape-time 0
set -g history-limit 50000

# Auto-enter copy-mode when scrolling up
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Scroll bindings in copy-mode for both key tables
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# Clipboard integration on macOS
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Stock ticker in status bar
set -g status-right-length 180
set -g @tmux-stock-symbols 'sh000001:上,sz399001:深,sh600160:巨,sh600415:废,hk01810:米'
set -g status-right '#[fg=yellow]%H:%M %Y-%m-%d'

# scrolling lyrics after the session name and window list
set -g status-left-length 100
set -g status-left ' [#{session_name}] '
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist]#(~/.local/bin/tmux-lyrics.sh)#[align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# Tmux session persistence
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'snxq/tmux-stock'
set -g @plugin 'ofirgall/tmux-browser'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TPM, keep this line at the bottom
run '~/.tmux/plugins/tpm/tpm'
